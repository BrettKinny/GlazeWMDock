<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- GlazeWM Workspaces — traced monitor glyph (Segoe Fluent U+E7F4) with BSP-tiled panes on screen -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#1e2430"/>

  <!-- monitor screen frame -->
  <rect x="40" y="52" width="176" height="124" rx="14" fill="none" stroke="#e8e8ec" stroke-width="12" stroke-linejoin="round"/>

  <!-- BSP-tiled panes inside the screen -->
  <g>
    <!-- large focused pane, left -->
    <rect x="60" y="72" width="86" height="84" rx="5" fill="#8ab4f8"/>
    <!-- two stacked panes, right -->
    <rect x="154" y="72" width="42" height="39" rx="5" fill="#8ab4f8" opacity="0.7"/>
    <rect x="154" y="117" width="42" height="39" rx="5" fill="#8ab4f8" opacity="0.45"/>
  </g>

  <!-- stand -->
  <rect x="116" y="176" width="24" height="18" fill="#e8e8ec"/>
  <rect x="82" y="192" width="92" height="14" rx="7" fill="#e8e8ec"/>
</svg>
